# ────────────────────────────────────────────────
#  Syndicate RP — FiveM Server Configuration
#  Secrets live in server.cfg.local (gitignored)
#  Create it from server.cfg.local.example (see docs/go-live-checklist.md)
# ────────────────────────────────────────────────

# Load secrets (license key, DB connection string) from local file
exec "server.cfg.local"

# ── Identity ──────────────────────────────────────
sv_hostname "^1Syndicate RP ^7| ^2Car Culture ^7| ^3Premium FiveM"
sv_projectName "Syndicate RP"
sv_projectDesc "Premium car culture & RP server. Custom cars, drag racing, crew wars."
sets tags "car culture, racing, rp, custom cars, fivem, qbox"
sets locale "en-US"
sets banner_detail "https://i.imgur.com/placeholder.png"
sets banner_connecting "https://i.imgur.com/placeholder.png"

# ── Network ───────────────────────────────────────
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 128

# ── OneSync ───────────────────────────────────────
# "on" = OneSync Infinity (the only correct value for licensed servers).
# NOTE: "infinity" is NOT a valid convar value. qbx_core also needs this passed on
# the command line (`+set onesync on`) - the Dockerfile CMD and scripts/start.sh do so.
set onesync on

# ── Steam / Endpoints ─────────────────────────────
# sv_steamWebApiKey "REPLACE_IF_USING_STEAM_AUTH"

# ── Rate Limits / Hardening ───────────────────────
sv_endpointPrivacy true
sv_enforceGameBuild 3258

# ── Voice ─────────────────────────────────────────
# pma-voice (installed by scripts/install.sh), settings per the Qbox recipe
setr voice_useNativeAudio true
setr voice_enableUi 1
setr voice_enableProximityCycle 1
setr voice_defaultCycle "GRAVE"
setr voice_defaultVoiceMode 2
setr voice_enableRadios 1
setr voice_enableCalls 1
setr voice_enableSubmix 1
setr voice_useSendingRangeOnly true

# ─────────────────────────────────────────────────
#  RESOURCE LOAD ORDER
#  Dependencies must load before dependents.
#  Grouped by category — do not reorder carelessly.
# ─────────────────────────────────────────────────

# ── System Resources ──────────────────────────────
# `chat` ships inside the FiveM artifact; mapmanager, spawnmanager and baseevents
# are installed from cfx-server-data by scripts/install.sh.
# (sessionmanager and hardcap no longer exist upstream, so they are not ensured.)
set resources_useSystemChat true
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

# ── Voice ─────────────────────────────────────────
ensure pma-voice

# ── Framework convars (MUST be set before qbx_core starts) ──
# qbx_core refuses to boot (and quits the server) unless ox_inventory
# is told it's running in Qbox mode. ox_inventory reads this too.
setr inventory:framework "qbx"

# ── Core Infrastructure ───────────────────────────
ensure oxmysql
ensure ox_lib

# ── Framework ─────────────────────────────────────
ensure qbx_core
# ox_target is used by syndicate-clubs and syndicate-meets; it needs qbx_core loaded first
ensure ox_target

# ── Inventory ─────────────────────────────────────
ensure ox_inventory

# ── Server Config (must load before the Syndicate resources that read it) ──
ensure syndicate-config

# ── UI / HUD ──────────────────────────────────────
ensure syndicate-hud

# ── Gameplay Core ─────────────────────────────────
ensure ox_doorlock
ensure qbx_vehicles
ensure qbx_garages
ensure ox_fuel
# qbx_phone removed: the archived port needs qb-* resources that are not installed.

# ── Economy ───────────────────────────────────────
# ensure qbx_banking      # install manually when available
# ensure qbx_shops        # install manually when available

# ── Jobs ──────────────────────────────────────────
# ensure qbx_mechanicjob  # install manually when available

# ── Handling (GTA VI cinematic physics) ───────────
# ensure TairaRealisticHandling  # download from forum.cfx.re
ensure DriveV                    # cinematic weight + deformation (installed to [handling]/DriveV)
# DISABLED: syndicate-handling lists ~10 fields per vehicle; a partial handling entry may
# zero the remaining fields and make those cars undrivable. Cannot be confirmed without a
# running server - test ONE car first, then uncomment.
# ensure syndicate-handling

# ── Map (Vice City) ────────────────────────────────
# ensure VICECRY_FM_W          # uncomment after manual install (see docs/visual-setup.md)

# ── Maps (gta5-mods imports — FiveM-compatible ymap/MLO only) ──
# DISABLED: these three are manual downloads (not in this repo, not installed by
# scripts/install.sh). Drop each into resources/[maps]/ and uncomment.
# ensure burgershot              # full MLO interior (ships its own fxmanifest)
# ensure highfield_mansion       # ymap prop map
# ensure villa_jayway            # ymap prop map

# ── Syndicate Custom ──────────────────────────────
ensure syndicate-racing
ensure syndicate-clubs
ensure syndicate-meets

# ── Admin ─────────────────────────────────────────
# ensure es_extended_adminmenu  # install manually when available

# ─────────────────────────────────────────────────
#  ACE PERMISSIONS
# ─────────────────────────────────────────────────

# Superadmin group. Put YOUR add_principal line in server.cfg.local (see
# server.cfg.local.example): join once, run `status` in the server console to see
# your license identifier.
add_ace group.superadmin command allow
add_ace group.superadmin command.add_principal allow
add_ace group.superadmin command.remove_principal allow

add_ace group.admin command allow
add_ace group.moderator command.kick allow
add_ace group.moderator command.ban allow

# Syndicate staff commands (restricted commands: ACE is command.<name>)
add_ace group.admin command.meetopen allow
add_ace group.admin command.meetvote allow
add_ace group.admin command.clubdisband allow
add_ace group.admin command.clublist allow

# ─────────────────────────────────────────────────
#  CONVARS (shared with client)
# ─────────────────────────────────────────────────
setr sv_serverId 1
setr syndicate_serverName "Syndicate RP"
setr syndicate_discordUrl "https://discord.gg/REPLACE"   # TODO(launch): your real Discord invite
setr syndicate_tebexUrl "https://syndicaterp.tebex.io"   # TODO(launch): your real Tebex store slug
setr syndicate_maxGarageSlots 10
setr syndicate_vipGarageSlots 20
setr syndicate_eliteGarageSlots 50
