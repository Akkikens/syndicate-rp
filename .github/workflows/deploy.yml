name: Deploy to Production

on:
  push:
    branches: [main]
    # Only server-side changes redeploy the game server (website-only pushes do not)
    paths:
      - "server-data/**"
      - "scripts/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          # A real Cfx.re license key looks like cfxk_ followed by a long token.
          # Search the whole tree (except .git and this workflow file).
          if grep -rEn "cfxk_[A-Za-z0-9_]{20,}" . --exclude-dir=.git --exclude-dir=node_modules --exclude=deploy.yml; then
            echo "ERROR: Cfx.re license key found in the repo - move it to server.cfg.local"
            exit 1
          fi
          echo "No license keys found - OK"

      - name: Lint Lua files
        uses: lunarmodules/luacheck@v1
        with:
          args: server-data/resources/syndicate-*/
        # Blocking: .luacheckrc declares the FiveM/ox_lib globals; the lint passes locally.

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: validate
    # Only deploy when the repository variable DEPLOYMENT_ENABLED is set to 'true'
    # (Settings > Secrets and variables > Actions > Variables)
    if: ${{ vars.DEPLOYMENT_ENABLED == 'true' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/syndicate-rp
            git pull --ff-only origin main
            bash scripts/install.sh
            docker compose restart fivem
            echo "Deploy complete."
